<!-- public/og.png の元。1200x630 でスクリーンショットして更新する -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans+JP:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        display: flex;
        background: #fff7ec;
        color: #3b2416;
        font-family: 'Noto Sans JP', sans-serif;
        font-feature-settings: 'palt';
      }
      .text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 80px;
      }
      .eyebrow {
        color: #b4520f;
        font-size: 18px;
        letter-spacing: 0.3em;
      }
      .name-en {
        margin-top: 20px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 104px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .name-ja {
        margin-top: 16px;
        color: #6b4c38;
        font-size: 22px;
        letter-spacing: 0.3em;
      }
      .catch {
        margin-top: 48px;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.8;
        letter-spacing: 0.1em;
      }
      .catch span {
        color: #b4520f;
      }
      .visual {
        position: relative;
        width: 420px;
        overflow: hidden;
        background: #f6923f;
      }
      .visual img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 30%;
      }
      .credit {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 80px 24px 18px;
        background: linear-gradient(to top, rgb(255 247 236 / 0.9), transparent);
        color: #6b4c38;
        font-size: 15px;
        letter-spacing: 0.1em;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="eyebrow">TECHNICAL LEADER / INFRASTRUCTURE</div>
      <div class="name-en">Koya Okada</div>
      <div class="name-ja">岡田 昊也 ・ わにゃ（Wanyaldee）</div>
      <div class="catch">
        現場の痛みを背負い、<br />共通の目標を掲げて挑戦を支える<br /><span
          >技術リーダー</span
        >
      </div>
    </div>
    <div class="visual">
      <img src="../public/avatar_all.jpg" alt="" />
      <div class="credit">Illustration by ᴸⁱʸ</div>
    </div>
  </body>
</html>
